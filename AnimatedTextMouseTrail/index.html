<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mouse Trail - Animated Text</title>
</head>
<body>
    <div class="cursor"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" integrity="sha512-Qrpii3NEFZ02RN6ZqpTu6pS/5PEq7EzBYJLki3AKBd8IncrlAwQdZHzExYwS0+b1NM0/qfxI1GOhqWLVosocDA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            let cursor = document.querySelector('.cursor');
            let textContent = "Animated Text Trail Effect";

            for(let i=0; i<textContent.length; i++){
                let span = document.createElement('span');
                span.classList.add('text');
                span.style.setProperty('--i', i+1);
                span.style.left = i*.6 + 'em';
                span.style.filter = `hue-rotate(${i*40}deg)`
                span.textContent = textContent[i];
                cursor.appendChild(span);
            }
        });

        document.addEventListener("mousemove", (e)=>{
            gsap.to(".text", {
                x: e.clientX,
                y: e.clientY,
                stagger: .03
            })
        })
    </script>
</body>
</html>
